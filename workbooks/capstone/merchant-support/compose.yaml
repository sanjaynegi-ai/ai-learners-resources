name: skillup-capstone
services:
  support:
    image: ${CAPSTONE_IMAGE:-quickcart-capstone:reference-v1}
    ports:
      - "127.0.0.1:8013:8000"
    volumes:
      - support-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: "no"
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
volumes:
  support-state:
