[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escalation-eval"
version = "0.1.0"
description = "W-ML-EVAL-01: evaluate a synthetic QuickCart escalation model with baselines, slices and denominators"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Resolve only releases published before this date so locked versions are at least two weeks old.
exclude-newer = "2026-09-30T00:00:00Z"
