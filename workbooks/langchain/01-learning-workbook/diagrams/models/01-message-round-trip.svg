<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="Chat model message round trip"><title>Chat model message round trip</title><desc>Application validation precedes system and human messages, provider adapter invocation, and response inspection. Hosted and local services differ.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#CBD5E1"/></marker></defs><rect width="1100" height="420" fill="#0B1020"/><g font-family="Arial,sans-serif"><text x="30" y="45" fill="#F8FAFC" font-size="25" font-weight="bold">Messages in; an assistant message out</text><rect x="30" y="140" width="230" height="100" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="42" y="178" fill="#F8FAFC" font-size="19">Validate</text><text x="42" y="210" fill="#CBD5E1" font-size="15">Question + configuration</text><path d="M262 190 L295 190" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="140" width="230" height="100" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="312" y="178" fill="#F8FAFC" font-size="19">Messages</text><text x="312" y="210" fill="#CBD5E1" font-size="15">System + human</text><path d="M532 190 L565 190" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/><rect x="570" y="140" width="230" height="100" rx="12" fill="#17253C" stroke="#34D399" stroke-width="2.5"/><text x="582" y="178" fill="#F8FAFC" font-size="19">Adapter / service</text><text x="582" y="210" fill="#CBD5E1" font-size="15">Hosted API or Ollama</text><path d="M802 190 L835 190" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#a)"/><rect x="840" y="140" width="230" height="100" rx="12" fill="#17253C" stroke="#FBBF24" stroke-width="2.5"/><text x="852" y="178" fill="#F8FAFC" font-size="19">Inspect AIMessage</text><text x="852" y="210" fill="#CBD5E1" font-size="15">Content + metadata</text><text x="30" y="300" fill="#FB7185" font-size="18">Failure boundaries: invalid input | missing configuration | service rejection / timeout</text><text x="30" y="350" fill="#CBD5E1" font-size="17">The adapter invokes the service; the application still evaluates correctness.</text></g></svg>