<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="460" viewBox="0 0 1140 460" role="img" aria-labelledby="title desc">
  <title id="title">Structured output has separate validation boundaries</title>
  <desc id="desc">A source request is extracted into a candidate, validated against a schema, and reviewed against policy and evidence. Invalid candidates stop before review. A schema-valid amount of 8000 can still contradict a source amount of 9000. Authorization is a separate gate before any action; this lab performs no action.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <rect width="1140" height="460" rx="18" fill="#0f172a"/>
  <g font-family="Arial, sans-serif" fill="#f1f5f9">
    <text x="35" y="45" font-size="23" font-weight="bold">Valid shape is one boundary. Truth and permission need their own checks.</text>
    <rect x="35" y="95" width="220" height="145" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="53" y="125" font-size="19" font-weight="bold">Source request</text>
    <text x="53" y="157" font-size="16">Monitor, INR 9000</text>
    <text x="53" y="187" font-size="16">Model extracts fields</text>
    <text x="53" y="217" font-size="15" fill="#cbd5e1">Candidate, not approval</text>
    <rect x="305" y="95" width="230" height="145" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="323" y="125" font-size="19" font-weight="bold">Parse and validate</text>
    <text x="323" y="157" font-size="16">Fields, types, choices</text>
    <text x="323" y="187" font-size="16">Required keys, bounds</text>
    <text x="323" y="217" font-size="15" fill="#cbd5e1">Reject invalid candidates</text>
    <rect x="585" y="95" width="230" height="145" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="603" y="125" font-size="19" font-weight="bold">Policy and evidence</text>
    <text x="603" y="157" font-size="16">Amount fits policy?</text>
    <text x="603" y="187" font-size="16">Fields match source?</text>
    <text x="603" y="217" font-size="15" fill="#cbd5e1">Lab ends at review</text>
    <rect x="865" y="95" width="240" height="145" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="883" y="125" font-size="19" font-weight="bold">Before any action</text>
    <text x="883" y="157" font-size="16">Trusted authorization</text>
    <text x="883" y="187" font-size="16">Balance + approval state</text>
    <text x="883" y="217" font-size="15" fill="#cbd5e1">No write action in this lab</text>
    <rect x="305" y="290" width="230" height="100" rx="12" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="323" y="321" font-size="18" font-weight="bold">Stop: invalid output</text>
    <text x="323" y="351" font-size="16">No typed result consumed</text>
    <text x="323" y="377" font-size="15" fill="#cbd5e1">No automatic repair</text>
    <rect x="585" y="290" width="520" height="100" rx="12" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="603" y="321" font-size="18" font-weight="bold">Counterexample: extracted amount 8000</text>
    <text x="603" y="351" font-size="16">Schema passes. Ceiling passes. Source still says 9000.</text>
    <text x="603" y="377" font-size="15" fill="#cbd5e1">A real quote does not prove that every field is correct.</text>
    <text x="35" y="432" font-size="16" fill="#cbd5e1">Schema-guided generation constrains supported output; fallback parsing checks text after generation.</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M255 165 H298"/><path d="M535 165 H578"/>
    <path d="M815 165 H858" stroke-dasharray="6 5"/>
    <path d="M420 240 V283"/>
  </g>
</svg>
