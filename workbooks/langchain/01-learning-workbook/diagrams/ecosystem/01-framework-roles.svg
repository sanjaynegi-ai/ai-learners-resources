<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="Framework roles: different responsibilities"><title>Framework roles: different responsibilities</title><desc>Application owns correctness and permissions; classic APIs are a separate namespace.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#CBD5E1"/></marker></defs><rect width="1100" height="620" fill="#0B1020"/><g font-family="Arial,sans-serif"><text x="30" y="42" fill="#F8FAFC" font-size="25" font-weight="bold">Framework roles: different responsibilities</text><text x="30" y="80" fill="#CBD5E1" font-size="16">Model call path</text><rect x="30" y="95" width="310" height="82" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="45" y="125" fill="#F8FAFC" font-size="19">Application + core</text><text x="45" y="152" fill="#CBD5E1" font-size="15">Evidence, prompts, validation</text><path d="M342 136 L385 136" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="200" fill="#CBD5E1" font-size="13" text-anchor="middle">messages</text><rect x="390" y="95" width="310" height="82" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="405" y="125" fill="#F8FAFC" font-size="19">Provider adapter</text><text x="405" y="152" fill="#CBD5E1" font-size="15">langchain-openai / ollama</text><path d="M702 136 L745 136" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="200" fill="#CBD5E1" font-size="13" text-anchor="middle">request</text><rect x="750" y="95" width="310" height="82" rx="12" fill="#17253C" stroke="#34D399" stroke-width="2.5"/><text x="765" y="125" fill="#F8FAFC" font-size="19">Provider or local service</text><text x="765" y="152" fill="#CBD5E1" font-size="15">Executes model inference</text><text x="30" y="220" fill="#CBD5E1" font-size="16">Agent runtime relationship</text><rect x="30" y="235" width="310" height="82" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="45" y="265" fill="#F8FAFC" font-size="19">LangChain agents</text><text x="45" y="292" fill="#CBD5E1" font-size="15">create_agent and controls</text><path d="M342 276 L385 276" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="340" fill="#CBD5E1" font-size="13" text-anchor="middle">built on</text><rect x="390" y="235" width="310" height="82" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="405" y="265" fill="#F8FAFC" font-size="19">LangGraph runtime</text><text x="405" y="292" fill="#CBD5E1" font-size="15">State and execution</text><text x="30" y="360" fill="#CBD5E1" font-size="16">Separate capabilities; not stages in every call</text><rect x="30" y="375" width="310" height="82" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="45" y="405" fill="#F8FAFC" font-size="19">LangSmith</text><text x="45" y="432" fill="#CBD5E1" font-size="15">Observes traces / evaluations</text><path d="M342 416 L385 416" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="480" fill="#CBD5E1" font-size="13" text-anchor="middle">separate</text><rect x="390" y="375" width="310" height="82" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="405" y="405" fill="#F8FAFC" font-size="19">langchain-classic</text><text x="405" y="432" fill="#CBD5E1" font-size="15">Older compatibility APIs</text><path d="M702 416 L745 416" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="480" fill="#CBD5E1" font-size="13" text-anchor="middle">separate</text><rect x="750" y="375" width="310" height="82" rx="12" fill="#17253C" stroke="#34D399" stroke-width="2.5"/><text x="765" y="405" fill="#F8FAFC" font-size="19">Direct graph authoring</text><text x="765" y="432" fill="#CBD5E1" font-size="15">Optional workflow design</text><text x="30" y="590" fill="#FBBF24" font-size="16">Application owns correctness and permissions; classic APIs are a separate namespace.</text></g></svg>