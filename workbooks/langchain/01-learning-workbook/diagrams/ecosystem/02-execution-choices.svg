<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="Choose execution from the requirement"><title>Choose execution from the requirement</title><desc>Failure checks: missing evidence, invalid arguments, and loop limits remain explicit.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#CBD5E1"/></marker></defs><rect width="1100" height="620" fill="#0B1020"/><g font-family="Arial,sans-serif"><text x="30" y="42" fill="#F8FAFC" font-size="25" font-weight="bold">Choose execution from the requirement</text><text x="30" y="80" fill="#CBD5E1" font-size="16">Chain: application defines the sequence</text><rect x="30" y="95" width="310" height="82" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="45" y="125" fill="#F8FAFC" font-size="19">Format prompt</text><text x="45" y="152" fill="#CBD5E1" font-size="15">Supplied policy passage</text><path d="M342 136 L385 136" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="200" fill="#CBD5E1" font-size="13" text-anchor="middle">prompt</text><rect x="390" y="95" width="310" height="82" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="405" y="125" fill="#F8FAFC" font-size="19">Call model</text><text x="405" y="152" fill="#CBD5E1" font-size="15">Generate summary</text><path d="M702 136 L745 136" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="200" fill="#CBD5E1" font-size="13" text-anchor="middle">response</text><rect x="750" y="95" width="310" height="82" rx="12" fill="#17253C" stroke="#34D399" stroke-width="2.5"/><text x="765" y="125" fill="#F8FAFC" font-size="19">Parse result</text><text x="765" y="152" fill="#CBD5E1" font-size="15">Return usable output</text><text x="30" y="220" fill="#CBD5E1" font-size="16">Workflow: application defines branches</text><rect x="30" y="235" width="310" height="82" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="45" y="265" fill="#F8FAFC" font-size="19">Retrieve evidence</text><text x="45" y="292" fill="#CBD5E1" font-size="15">Candidate passages</text><path d="M342 276 L385 276" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="340" fill="#CBD5E1" font-size="13" text-anchor="middle">evidence</text><rect x="390" y="235" width="310" height="82" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="405" y="265" fill="#F8FAFC" font-size="19">Check sufficiency</text><text x="405" y="292" fill="#CBD5E1" font-size="15">Answer or abstain branch</text><path d="M702 276 L745 276" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="340" fill="#CBD5E1" font-size="13" text-anchor="middle">decision</text><rect x="750" y="235" width="310" height="82" rx="12" fill="#17253C" stroke="#34D399" stroke-width="2.5"/><text x="765" y="265" fill="#F8FAFC" font-size="19">Return result</text><text x="765" y="292" fill="#CBD5E1" font-size="15">Explain missing evidence</text><text x="30" y="360" fill="#CBD5E1" font-size="16">Agent: model requests tools within controls</text><rect x="30" y="375" width="310" height="82" rx="12" fill="#17253C" stroke="#22D3EE" stroke-width="2.5"/><text x="45" y="405" fill="#F8FAFC" font-size="19">Model chooses tool</text><text x="45" y="432" fill="#CBD5E1" font-size="15">Bounded number of steps</text><path d="M342 416 L385 416" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="480" fill="#CBD5E1" font-size="13" text-anchor="middle">arguments</text><rect x="390" y="375" width="310" height="82" rx="12" fill="#17253C" stroke="#A78BFA" stroke-width="2.5"/><text x="405" y="405" fill="#F8FAFC" font-size="19">Validate + execute</text><text x="405" y="432" fill="#CBD5E1" font-size="15">Application authorization</text><path d="M702 416 L745 416" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="480" fill="#CBD5E1" font-size="13" 