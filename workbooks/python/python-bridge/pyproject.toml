[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickcart-python-bridge"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
quickcart-bridge = "quickcart_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
