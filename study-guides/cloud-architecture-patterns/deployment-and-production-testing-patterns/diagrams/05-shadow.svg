<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 655" role="img" aria-labelledby="title desc">
<title id="title">Copied input still needs effect controls</title><desc id="desc">The primary serves the user; the shadow feeds evidence under a no-effects boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="760" height="655" rx="14" fill="#0B1020"/>
<g font-family="Arial, sans-serif" fill="#F8FAFC">
<text x="30" y="43" font-size="26" font-weight="bold">Copied input still needs effect controls</text>
<rect x="160" y="85" width="440" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="117" text-anchor="middle" font-size="23" font-weight="bold">Routing boundary</text><text x="380.0" y="146" text-anchor="middle" font-size="20" fill="#CBD5E1">Primary request + bounded sampled copy</text>
<path d="M 285 167 V 205 H 190 V 245" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 475 167 V 205 H 570 V 245" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="250" width="310" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="190.0" y="282" text-anchor="middle" font-size="23" font-weight="bold">Primary service</text><text x="190.0" y="311" text-anchor="middle" font-size="20" fill="#CBD5E1">Permitted normal behavior</text>
<rect x="415" y="250" width="310" height="82" rx="12" fill="#172136" stroke="#A78BFA" stroke-width="2"/><text x="570.0" y="282" text-anchor="middle" font-size="23" font-weight="bold">Shadow candidate</text><text x="570.0" y="311" text-anchor="middle" font-size="20" fill="#CBD5E1">No customer effects</text>
<path d="M 190 332 V 395" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 570 332 V 395" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="400" width="310" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="190.0" y="432" text-anchor="middle" font-size="23" font-weight="bold">Customer response</text><text x="190.0" y="461" text-anchor="middle" font-size="20" fill="#CBD5E1">Only the primary responds</text>
<rect x="415" y="400" width="310" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="570.0" y="432" text-anchor="middle" font-size="23" font-weight="bold">Isolated result sink</text><text x="570.0" y="461" text-anchor="middle" font-size="20" fill="#CBD5E1">Compare; never return to user</text>
<text x="35" y="545" font-size="19" fill="#CBD5E1">Required shadow controls: scoped identity, isolated writes,</text>
<text x="35" y="575" font-size="19" fill="#CBD5E1">blocked real tool effects, retention and workload limits.</text>
<text x="35" y="620" font-size="19" fill="#CBD5E1">Discarding a response alone does not enforce these controls.</text>
</g></svg>
