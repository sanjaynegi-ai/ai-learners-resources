<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-labelledby="title desc">
<title id="title">Let evidence control the next exposure</title><desc id="desc">Traffic assignments feed versioned evidence into a release decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="760" height="730" rx="14" fill="#0B1020"/>
<g font-family="Arial, sans-serif" fill="#F8FAFC">
<text x="30" y="43" font-size="26" font-weight="bold">Let evidence control the next exposure</text>
<rect x="160" y="85" width="440" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="117" text-anchor="middle" font-size="23" font-weight="bold">Eligible traffic</text><text x="380.0" y="146" text-anchor="middle" font-size="20" fill="#CBD5E1">Record assignment and actual version</text>
<path d="M 285 167 V 205 H 190 V 245" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 475 167 V 205 H 570 V 245" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="250" width="310" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="190.0" y="282" text-anchor="middle" font-size="23" font-weight="bold">Control</text><text x="190.0" y="311" text-anchor="middle" font-size="20" fill="#CBD5E1">95% in this example</text>
<rect x="415" y="250" width="310" height="82" rx="12" fill="#172136" stroke="#A78BFA" stroke-width="2"/><text x="570.0" y="282" text-anchor="middle" font-size="23" font-weight="bold">Candidate</text><text x="570.0" y="311" text-anchor="middle" font-size="20" fill="#CBD5E1">5% in this example</text>
<path d="M 190 332 V 390 H 310 V 435" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 570 332 V 390 H 450 V 435" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="140" y="440" width="480" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="380.0" y="472" text-anchor="middle" font-size="23" font-weight="bold">Compare useful outcomes</text><text x="380.0" y="501" text-anchor="middle" font-size="20" fill="#CBD5E1">Version, cohort, denominator and time window</text>
<path d="M 380 522 V 565" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="140" y="570" width="480" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="380.0" y="602" text-anchor="middle" font-size="23" font-weight="bold">Promote / hold / stop</text><text x="380.0" y="631" text-anchor="middle" font-size="20" fill="#CBD5E1">Missing evidence is not a pass</text>
<text x="35" y="695" font-size="19" fill="#CBD5E1">Illustrative request split; shared effects can exceed 5%.</text>
</g></svg>
