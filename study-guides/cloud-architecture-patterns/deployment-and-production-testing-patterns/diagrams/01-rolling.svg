<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" role="img" aria-labelledby="title desc">
<title id="title">Replace a bounded batch, then check</title><desc id="desc">A mixed fleet removes new routing, drains, replaces and checks before another batch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="760" height="750" rx="14" fill="#0B1020"/>
<g font-family="Arial, sans-serif" fill="#F8FAFC">
<text x="30" y="43" font-size="26" font-weight="bold">Replace a bounded batch, then check</text>
<rect x="70" y="85" width="620" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="117" text-anchor="middle" font-size="23" font-weight="bold">Mixed fleet remains serving</text><text x="380.0" y="146" text-anchor="middle" font-size="20" fill="#CBD5E1">Capacity and contracts must hold</text>
<path d="M 380 167 V 205" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="210" width="620" height="82" rx="12" fill="#172136" stroke="#A78BFA" stroke-width="2"/><text x="380.0" y="242" text-anchor="middle" font-size="23" font-weight="bold">Remove batch from new routing</text><text x="380.0" y="271" text-anchor="middle" font-size="20" fill="#CBD5E1">Allow routing changes to propagate</text>
<path d="M 380 292 V 330" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="335" width="620" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="380.0" y="367" text-anchor="middle" font-size="23" font-weight="bold">Drain accepted work</text><text x="380.0" y="396" text-anchor="middle" font-size="20" fill="#CBD5E1">Bound waiting; preserve unfinished jobs</text>
<path d="M 380 417 V 455" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="460" width="620" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="492" text-anchor="middle" font-size="23" font-weight="bold">Replace, warm and check readiness</text><text x="380.0" y="521" text-anchor="middle" font-size="20" fill="#CBD5E1">Surge may start replacements earlier</text>
<path d="M 380 542 V 580" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="585" width="620" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="380.0" y="617" text-anchor="middle" font-size="23" font-weight="bold">Gate before the next batch</text><text x="380.0" y="646" text-anchor="middle" font-size="20" fill="#CBD5E1">Pause or recover if useful service regresses</text>
<text x="40" y="715" font-size="19" fill="#CBD5E1">Lifecycle order; readiness does not prove compatibility.</text>
</g></svg>
