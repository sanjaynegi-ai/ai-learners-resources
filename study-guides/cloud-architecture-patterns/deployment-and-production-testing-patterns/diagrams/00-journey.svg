<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 625" role="img" aria-labelledby="title desc">
<title id="title">Change a running system deliberately</title><desc id="desc">Learning stages: identify, expose, evaluate, recover.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="760" height="625" rx="14" fill="#0B1020"/>
<g font-family="Arial, sans-serif" fill="#F8FAFC">
<text x="30" y="43" font-size="26" font-weight="bold">Change a running system deliberately</text>
<rect x="70" y="85" width="620" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="117" text-anchor="middle" font-size="23" font-weight="bold">1. Identify the change</text><text x="380.0" y="146" text-anchor="middle" font-size="20" fill="#CBD5E1">Artifact, configuration, data and model</text>
<path d="M 380 167 V 205" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="210" width="620" height="82" rx="12" fill="#172136" stroke="#A78BFA" stroke-width="2"/><text x="380.0" y="242" text-anchor="middle" font-size="23" font-weight="bold">2. Control exposure</text><text x="380.0" y="271" text-anchor="middle" font-size="20" fill="#CBD5E1">Who sees which behavior, and when?</text>
<path d="M 380 292 V 330" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="335" width="620" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="380.0" y="367" text-anchor="middle" font-size="23" font-weight="bold">3. Evaluate evidence</text><text x="380.0" y="396" text-anchor="middle" font-size="20" fill="#CBD5E1">Useful outcomes, limits and uncertainty</text>
<path d="M 380 417 V 455" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="460" width="620" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="380.0" y="492" text-anchor="middle" font-size="23" font-weight="bold">4. Recover compatible service</text><text x="380.0" y="521" text-anchor="middle" font-size="20" fill="#CBD5E1">Stop exposure; verify state and obligations</text>
<text x="40" y="590" font-size="19" fill="#CBD5E1">Learning order, not a network request path.</text>
</g></svg>
