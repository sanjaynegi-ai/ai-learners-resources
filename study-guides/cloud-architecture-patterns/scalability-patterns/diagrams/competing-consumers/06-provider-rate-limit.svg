<text x="425.0" y="98.0" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" fill="#f8fafc">Worker pool</text>
<text x="425.0" y="124.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#bfcfe1">10 workers</text>
