<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="Before: session trapped on one server"><rect width="1100" height="400" fill="#0B1020"/><text x="38" y="49" fill="#F4F7FF" font-family="Arial,sans-serif" font-weight="bold" font-size="26">Before: session trapped on one server</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#CBD5E1" stroke-width="1.5"/></marker></defs><path d="M215 178 L335 135" stroke="#AABBD1" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="275.0" y="144.5" font-family="Arial" font-size="14" text-anchor="middle" fill="#E2E8F0">request 1</text><path d="M215 193 L335 276" stroke="#AABBD1" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="275.0" y="222.5" font-family="Arial" font-size="14" text-anchor="middle" fill="#E2E8F0">request 2</text><rect x="35" y="132" width="180" height="105" rx="13" fill="#172136" stroke="#22D3EE" stroke-width="2.5"/><text x="125.0" y="180.5" fill="#FFFFFF" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Alice</text><text x="125.0" y="207.5" fill="#CBD5E1" font-family="Arial" font-size="14" text-anchor="middle">cart = 2 items</text><rect x="335" y="83" width="215" height="105" rx="13" fill="#172136" stroke="#A78BFA" stroke-width="2.5"/><text x="442.5" y="131.5" fill="#FFFFFF" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">API A</text><text x="442.5" y="158.5" fill="#CBD5E1" font-family="Arial" font-size="14" text-anchor="middle">local cart = 2</text><rect x="335" y="227" width="215" height="105" rx="13" fill="#172136" stroke="#34D399" stroke-width="2.5"/><text x="442.5" y="275.5" fill="#FFFFFF" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">API B</text><text x="442.5" y="302.5" fill="#CBD5E1" font-family="Arial" font-size="14" text-anchor="middle">local cart = empty</text><rect x="700" y="135" width="245" height="105" rx="13" fill="#172136" stroke="#FBBF24" stroke-width="2.5"/><text x="822.5" y="183.5" fill="#FFFFFF" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Load balancer</text><text x="822.5" y="210.5" fill="#CBD5E1" font-family="Arial" font-size="14" text-anchor="middle">routes requests</text><text x="40" y="366" font-family="Arial" font-size="16" fill="#CBD5E1">A subsequent request to API B cannot see API A’s local session.</text></svg>