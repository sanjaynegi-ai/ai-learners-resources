<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Separate order acceptance from email delivery"><rect width="1100" height="340" fill="#0b1220"/><text x="35" y="44" font-size="24" font-weight="bold" font-family="Arial" fill="#fff">Separate order acceptance from email delivery</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<rect x="25" y="130" width="215" height="95" rx="12" fill="#182338" stroke="#a78bfa" stroke-width="2"/>
<text x="132.5" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Customer</text>
<text x="132.5" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Place order</text>
<rect x="305" y="130" width="230" height="95" rx="12" fill="#182338" stroke="#22d3ee" stroke-width="2"/>
<text x="420.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Order service</text>
<text x="420.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Order + outbox</text>
<rect x="605" y="130" width="205" height="95" rx="12" fill="#182338" stroke="#fbbf24" stroke-width="2"/>
<text x="707.5" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Email queue</text>
<text x="707.5" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Pending notification</text>
<rect x="880" y="130" width="190" height="95" rx="12" fill="#182338" stroke="#34d399" stroke-width="2"/>
<text x="975.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Worker</text>
<text x="975.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Send email</text>
