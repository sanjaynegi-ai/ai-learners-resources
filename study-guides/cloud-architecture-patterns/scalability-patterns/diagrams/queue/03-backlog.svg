<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Queue growth during a burst"><title>Queue growth during a burst</title><desc>Diagram labels in document order: Queue growth during a burst; Arrivals; 10,000 jobs/min; Backlog; +9,000 jobs/min; Completions; 1,000 jobs/min; Two-minute burst from empty queue: 18,000 jobs remain.. Arrows and scenario implications are explained in the accompanying chapter walkthrough.</desc><rect width="1100" height="340" fill="#0b1220"/><text x="35" y="44" font-size="24" font-weight="bold" font-family="Arial" fill="#fff">Queue growth during a burst</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<rect x="45" y="130" width="245" height="95" rx="12" fill="#182338" stroke="#a78bfa" stroke-width="2"/>
<text x="167.5" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Arrivals</text>
<text x="167.5" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">10,000 jobs/min</text>
<rect x="400" y="130" width="245" height="95" rx="12" fill="#182338" stroke="#22d3ee" stroke-width="2"/>
<text x="522.5" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Backlog</text>
<text x="522.5" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">+9,000 jobs/min</text>
<rect x="755" y="130" width="245" height="95" rx="12" fill="#182338" stroke="#fbbf24" stroke-width="2"/>
<text x="877.5" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Completions</text>
<text x="877.5" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">1,000 jobs/min</text>
<path d="M290 177 L400 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M645 177 L755 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="35" y="308" fill="#fbbf24" font-family="Arial" font-size="15">Two-minute burst from empty queue: 18,000 jobs remain.</text>
