<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Direct calls overload a slower provider"><rect width="1100" height="340" fill="#0b1220"/><text x="35" y="44" font-size="24" font-weight="bold" font-family="Arial" fill="#fff">Direct calls overload a slower provider</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<rect x="40" y="130" width="230" height="95" rx="12" fill="#182338" stroke="#a78bfa" stroke-width="2"/>
<text x="155.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Flash sale</text>
<text x="155.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">10,000 requests/min</text>
<rect x="365" y="130" width="230" height="95" rx="12" fill="#182338" stroke="#22d3ee" stroke-width="2"/>
<text x="480.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Order API</text>
<text x="480.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Waits for provider</text>
<rect x="710" y="130" width="260" height="95" rx="12" fill="#182338" stroke="#fbbf24" stroke-width="2"/>
<text x="840.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Email provider</text>
<text x="840.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">1,000 calls/min limit</text>
<path d="M270 177 L365 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M595 177 L710 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="35" y="308" fill="#fbbf24" font-family="Arial" font-size="15">Adding API instances cannot remove the provider limit.</text>
</svg>