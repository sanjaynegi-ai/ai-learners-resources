<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Backpressure protects finite queue capacity"><rect width="1100" height="340" fill="#0b1220"/><text x="35" y="44" font-size="24" font-weight="bold" font-family="Arial" fill="#fff">Backpressure protects finite queue capacity</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<rect x="35" y="130" width="210" height="95" rx="12" fill="#182338" stroke="#a78bfa" stroke-width="2"/>
<text x="140.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Producers</text>
<text x="140.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Burst arrivals</text>
<rect x="320" y="130" width="210" height="95" rx="12" fill="#182338" stroke="#22d3ee" stroke-width="2"/>
<text x="425.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Queue</text>
<text x="425.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Finite retention</text>
<rect x="605" y="130" width="210" height="95" rx="12" fill="#182338" stroke="#fbbf24" stroke-width="2"/>
<text x="710.0" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Workers</text>
<text x="710.0" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Bounded concurrency</text>
<rect x="890" y="130" width="175" height="95" rx="12" fill="#182338" stroke="#34d399" stroke-width="2"/>
<text x="977.5" y="172.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="bold">Provider</text>
<text x="977.5" y="196.5" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="12">Rate cap</text>
<path d="M245 177 L320 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M530 177 L605 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M815 177 L890 177" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="35" y="308" fill="#fbbf24" font-family="Arial" font-size="15">Throttle or reject transparently when safe acceptance is impossible.</text>
</svg>