<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="Autoscaling feedback loop"><title>Autoscaling feedback loop</title><desc>Diagram labels in document order: Autoscaling feedback loop; Metrics; CPU, RPS, latency; Policy; Target / threshold; Controller; Desired replicas; Instances; Ready capacity; Measure → decide → provision → warm up → observe again.. Arrows and scenario implications are explained in the accompanying chapter walkthrough.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs><rect width="1100" height="400" fill="#0b1220"/><text x="38" y="45" fill="#f8fafc" font-size="25" font-family="Arial" font-weight="bold">Autoscaling feedback loop</text><path d="M225 185 L290 185" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/><path d="M480 185 L545 185" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/><path d="M735 185 L800 185" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="140" width="190" height="90" rx="13" fill="#182338" stroke="#22d3ee" stroke-width="2.5"/><text x="130.0" y="179.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">Metrics</text><text x="130.0" y="204.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">CPU, RPS, latency</text><rect x="290" y="140" width="190" height="90" rx="13" fill="#182338" stroke="#a78bfa" stroke-width="2.5"/><text x="385.0" y="179.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">Policy</text><text x="385.0" y="204.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">Target / threshold</text><rect x="545" y="140" width="190" height="90" rx="13" fill="#182338" stroke="#34d399" stroke-width="2.5"/><text x="640.0" y="179.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">Controller</text><text x="640.0" y="204.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">Desired replicas</text><rect x="800" y="140" width="220" height="90" rx="13" fill="#182338" stroke="#fbbf24" stroke-width="2.5"/><text x="910.0" y="179.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">Instances</text><text x="910.0" y="204.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">Ready capacity</text><text x="42" y="362" fill="#fbbf24" font-family="Arial" font-size="17">Measure → decide → provision → warm up → observe again.</text></svg>