<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="Fixed capacity: demand can exceed available capacity"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs><rect width="1100" height="400" fill="#0b1220"/><text x="38" y="45" fill="#f8fafc" font-size="25" font-family="Arial" font-weight="bold">Fixed capacity: demand can exceed available capacity</text><path d="M245 180 L350 180" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/><path d="M570 180 L695 180" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/><rect x="45" y="135" width="200" height="90" rx="13" fill="#182338" stroke="#22d3ee" stroke-width="2.5"/><text x="145.0" y="174.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">Flash sale</text><text x="145.0" y="199.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">Traffic rises</text><rect x="350" y="135" width="220" height="90" rx="13" fill="#182338" stroke="#a78bfa" stroke-width="2.5"/><text x="460.0" y="174.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">Load balancer</text><text x="460.0" y="199.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">Routes requests</text><rect x="695" y="135" width="210" height="90" rx="13" fill="#182338" stroke="#34d399" stroke-width="2.5"/><text x="800.0" y="174.0" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="bold" font-family="Arial">2 API instances</text><text x="800.0" y="199.0" fill="#b9c7d9" text-anchor="middle" font-size="13" font-family="Arial">Fixed capacity</text><text x="42" y="362" fill="#fbbf24" font-family="Arial" font-size="17">The load balancer distributes traffic; it does not create additional servers.</text></svg>