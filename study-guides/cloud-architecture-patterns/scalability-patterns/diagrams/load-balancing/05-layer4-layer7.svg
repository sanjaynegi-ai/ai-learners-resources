<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img">
<title>Two routing levels: transport and application</title>
<rect width="1100" height="390" fill="#0b1020"/>
<text x="40" y="47" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="26" font-weight="bold">Two routing levels: transport and application</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#b7c7db" stroke-width="1.5"/></marker></defs>
<path d="M235 185 L350 110" stroke="#b7c7db" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<text x="292.5" y="138.5" text-anchor="middle" fill="#e4ebf7" font-family="Arial" font-size="14">transport</text>
<path d="M235 185 L350 265" stroke="#b7c7db" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<text x="292.5" y="216.0" text-anchor="middle" fill="#e4ebf7" font-family="Arial" font-size="14">HTTP</text>
<path d="M590 110 L760 185" stroke="#b7c7db" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M590 265 L760 185" stroke="#b7c7db" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect x="45" y="140" width="190" height="95" rx="13" fill="#17243a" stroke="#28d6e7" stroke-width="2.5"/>
<text x="140.0" y="182.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="bold">Client</text>
<text x="140.0" y="209.5" text-anchor="middle" fill="#b6c7db" font-family="Arial" font-size="14">TCP / HTTPS</text>
<rect x="350" y="65" width="240" height="90" rx="13" fill="#17243a" stroke="#ac8cff" stroke-width="2.5"/>
<text x="470.0" y="105.0" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="bold">Layer 4</text>
<text x="470.0" y="132.0" text-anchor="middle" fill="#b6c7db" font-family="Arial" font-size="14">IP + port / TCP</text>
<rect x="350" y="220" width="240" height="90" rx="13" fill="#17243a" stroke="#ffbd59" stroke-width="2.5"/>
<text x="470.0" y="260.0" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="bold">Layer 7</text>
<text x="470.0" y="287.0" text-anchor="middle" fill="#b6c7db" font-family="Arial" font-size="14">HTTP host / path</text>
<rect x="760" y="140" width="240" height="95" rx="13" fill="#17243a" stroke="#43dba1" stroke-width="2.5"/>
<text x="880.0" y="182.5" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="bold">Backend pool</text>
<text x="880.0" y="209.5" text-anchor="middle" fill="#b6c7db" font-family="Arial" font-size="14">API instances</text>
<text x="550" y="355" text-anchor="middle" fill="#e1b56a" font-family="Arial" font-size="16">These are alternative or combined deployment approaches, not sequential hops.</text>
</svg>