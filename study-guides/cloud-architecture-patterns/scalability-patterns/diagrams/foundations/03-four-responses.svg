<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><rect width="1100" height="380" fill="#090e19"/><text x="40" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#f3f6ff">Four ways to respond to pressure</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#aabbd3" stroke-width="1.5"/></marker></defs><rect x="45" y="120" width="220" height="105" rx="14" fill="#151e2e" stroke="#26cce1" stroke-width="2.5"/><text x="155.0" y="169.5" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Distribute</text><text x="155.0" y="195.5" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">route across workers</text><rect x="305" y="120" width="220" height="105" rx="14" fill="#151e2e" stroke="#9c7bff" stroke-width="2.5"/><text x="415.0" y="169.5" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Buffer</text><text x="415.0" y="195.5" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">store pending work</text><rect x="565" y="120" width="220" height="105" rx="14" fill="#151e2e" stroke="#38dca2" stroke-width="2.5"/><text x="675.0" y="169.5" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Parallelize</text><text x="675.0" y="195.5" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">execute concurrently</text><rect x="825" y="120" width="220" height="105" rx="14" fill="#151e2e" stroke="#ffb547" stroke-width="2.5"/><text x="935.0" y="169.5" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Partition</text><text x="935.0" y="195.5" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">divide by key</text></svg>