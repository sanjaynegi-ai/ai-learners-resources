<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-label="Two ways to add application capacity"><title>Two ways to add application capacity</title><desc>Diagram labels in document order: Two ways to add application capacity; Small VM; scale up; Large VM; one bigger machine; VM A; scale out; VM B; more instances. Arrows and scenario implications are explained in the accompanying chapter walkthrough.</desc><rect width="1100" height="380" fill="#090e19"/><text x="40" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#f3f6ff">Two ways to add application capacity</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#aabbd3" stroke-width="1.5"/></marker></defs><path d="M235 170 L325 170" stroke="#aabbd3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M535 170 L650 127" stroke="#aabbd3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M535 170 L650 247" stroke="#aabbd3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="120" width="180" height="100" rx="14" fill="#151e2e" stroke="#26cce1" stroke-width="2.5"/><text x="145.0" y="167.0" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Small VM</text><text x="145.0" y="193.0" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">scale up</text><rect x="325" y="120" width="210" height="100" rx="14" fill="#151e2e" stroke="#9c7bff" stroke-width="2.5"/><text x="430.0" y="167.0" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Large VM</text><text x="430.0" y="193.0" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">one bigger machine</text><rect x="670" y="85" width="170" height="85" rx="14" fill="#151e2e" stroke="#38dca2" stroke-width="2.5"/><text x="755.0" y="124.5" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">VM A</text><text x="755.0" y="150.5" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">scale out</text><rect x="670" y="205" width="170" height="85" rx="14" fill="#151e2e" stroke="#ffb547" stroke-width="2.5"/><text x="755.0" y="244.5" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">VM B</text><text x="755.0" y="270.5" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">more instances</text></svg>