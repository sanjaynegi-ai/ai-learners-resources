<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><rect width="1100" height="380" fill="#090e19"/><text x="40" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#f3f6ff">A queue absorbs a temporary burst</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#aabbd3" stroke-width="1.5"/></marker></defs><path d="M240 185 L355 185" stroke="#aabbd3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M555 185 L670 185" stroke="#aabbd3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="40" y="135" width="200" height="100" rx="14" fill="#151e2e" stroke="#26cce1" stroke-width="2.5"/><text x="140.0" y="182.0" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Producer</text><text x="140.0" y="208.0" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">10,000 jobs/min</text><rect x="355" y="135" width="200" height="100" rx="14" fill="#151e2e" stroke="#9c7bff" stroke-width="2.5"/><text x="455.0" y="182.0" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Durable queue</text><text x="455.0" y="208.0" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">backlog accumulates</text><rect x="670" y="135" width="200" height="100" rx="14" fill="#151e2e" stroke="#38dca2" stroke-width="2.5"/><text x="770.0" y="182.0" fill="#f5f7ff" font-family="Arial" font-size="19" font-weight="bold" text-anchor="middle">Workers</text><text x="770.0" y="208.0" fill="#aebbd1" font-family="Arial" font-size="13" text-anchor="middle">1,000 jobs/min</text></svg>