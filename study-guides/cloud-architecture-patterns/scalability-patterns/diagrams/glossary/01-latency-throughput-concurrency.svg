<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 410" role="img" aria-label="Performance: latency, throughput, and concurrency"><title>Performance: latency, throughput, and concurrency</title><desc>Diagram labels in document order: Performance: latency, throughput, and concurrency; Latency; Time per request; Throughput; Completions / second; Concurrency; In-flight requests; Little’s Law in a stable system: average in-flight work = throughput × average time.. Arrows and scenario implications are explained in the accompanying chapter walkthrough.</desc>
