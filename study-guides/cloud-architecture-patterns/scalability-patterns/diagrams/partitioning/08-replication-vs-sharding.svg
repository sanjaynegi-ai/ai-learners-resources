<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 405" role="img" aria-label="Replication and sharding solve different problems"><title>Replication and sharding solve different problems</title><desc>Diagram labels in document order: Replication and sharding solve different problems; Replication; Copies of same data; Sharding; Different data subsets; Replica per shard; Both combined; Backups; Recovery; Replicas improve availability/read capacity; shards distribute data ownership.. Arrows and scenario implications are explained in the accompanying chapter walkthrough.</desc><rect width="1120" height="405" fill="#0b1220"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" stroke="#cbd5e1" stroke-width="1.5" fill="none"/></marker></defs><text x="38" y="46" font-size="24" font-weight="bold" fill="#f8fafc" font-family="Arial">Replication and sharding solve different problems</text>
