<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="One slow shard can dominate total latency"><title>One slow shard can dominate total latency</title><desc>Diagram labels in document order: One slow shard can dominate total latency; straggler; Coordinator; Wait for replies; Shard A; 100 ms; Shard B; 150 ms; Shard C; 120 ms; Shard D; 4,000 ms; All-results wait; ≈ 4,000+ ms; Fan-out makes the slowest required response critical.. Arrows and scenario implications are explained in the accompanying chapter walkthrough.</desc><rect width="1120" height="500" fill="#0B1020"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" stroke="#cbd5e1" fill="none" stroke-width="1.5"/></marker></defs><text x="35" y="44" fill="#fff" font-size="24" font-family="Arial" font-weight="bold">One slow shard can dominate total latency</text>
