<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">Protect required work from optional work</title><desc id="desc">Separate connection pools reserve checkout capacity while recommendations degrade.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="760" height="610" rx="14" fill="#0B1020"/>
<g font-family="Arial, sans-serif" fill="#F8FAFC">
<text x="32" y="43" font-size="26" font-weight="bold">Protect required work from optional work</text>
<rect x="190" y="80" width="380" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="112" text-anchor="middle" font-size="23" font-weight="bold">QuickCart caller</text><text x="380.0" y="141" text-anchor="middle" font-size="20" fill="#CBD5E1">Required and optional work</text>
<path d="M 300 162 V 200 H 190 V 245" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 460 162 V 200 H 570 V 245" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="250" width="310" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="190.0" y="282" text-anchor="middle" font-size="23" font-weight="bold">Checkout pool</text><text x="190.0" y="311" text-anchor="middle" font-size="20" fill="#CBD5E1">40 reserved active slots</text>
<rect x="415" y="250" width="310" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="570.0" y="282" text-anchor="middle" font-size="23" font-weight="bold">Recommendation pool</text><text x="570.0" y="311" text-anchor="middle" font-size="20" fill="#CBD5E1">5 active slots maximum</text>
<path d="M 190 332 V 400" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 570 332 V 400" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="405" width="310" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="190.0" y="437" text-anchor="middle" font-size="23" font-weight="bold">Required payment</text><text x="190.0" y="466" text-anchor="middle" font-size="20" fill="#CBD5E1">No invented confirmation</text>
<rect x="415" y="405" width="310" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="570.0" y="437" text-anchor="middle" font-size="23" font-weight="bold">Optional outcome</text><text x="570.0" y="466" text-anchor="middle" font-size="20" fill="#CBD5E1">Omit unavailable widget</text>
<text x="35" y="540" font-size="19" fill="#CBD5E1">Illustrative allocation; catalog has 15 other slots.</text>
<text x="35" y="575" font-size="19" fill="#CBD5E1">Shared CPU, network and data stores remain limits.</text>
</g></svg>
