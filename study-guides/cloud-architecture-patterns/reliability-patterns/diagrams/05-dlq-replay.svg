<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" role="img" aria-labelledby="title desc">
<title id="title">Quarantine is the start of recovery</title><desc id="desc">Accepted messages are processed; exhausted work is quarantined, reviewed and safely replayed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<rect width="760" height="730" rx="14" fill="#0B1020"/>
<g font-family="Arial, sans-serif" fill="#F8FAFC">
<text x="32" y="43" font-size="26" font-weight="bold">Quarantine is the start of recovery</text>
<rect x="220" y="80" width="320" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="112" text-anchor="middle" font-size="23" font-weight="bold">Source queue</text><text x="380.0" y="141" text-anchor="middle" font-size="20" fill="#CBD5E1">Already accepted events</text>
<path d="M 380 162 V 220" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220" y="225" width="320" height="82" rx="12" fill="#172136" stroke="#22D3EE" stroke-width="2"/><text x="380.0" y="257" text-anchor="middle" font-size="23" font-weight="bold">Worker</text><text x="380.0" y="286" text-anchor="middle" font-size="20" fill="#CBD5E1">Bound attempts; preserve identity</text>
<path d="M 220 266 H 55 V 355" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="25" y="360" width="310" height="82" rx="12" fill="#172136" stroke="#4ADE80" stroke-width="2"/><text x="180.0" y="392" text-anchor="middle" font-size="23" font-weight="bold">Success path</text><text x="180.0" y="421" text-anchor="middle" font-size="20" fill="#CBD5E1">Durable effect, then acknowledge</text>
<path d="M 540 266 H 590 V 355" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400" y="337" font-size="19" fill="#CBD5E1">exhausted policy</text>
<rect x="400" y="360" width="330" height="82" rx="12" fill="#172136" stroke="#FBBF24" stroke-width="2"/><text x="565.0" y="392" text-anchor="middle" font-size="23" font-weight="bold">Dead-letter queue</text><text x="565.0" y="421" text-anchor="middle" font-size="20" fill="#CBD5E1">Unresolved; retention is bounded</text>
<path d="M 565 442 V 490" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="400" y="495" width="330" height="82" rx="12" fill="#172136" stroke="#A78BFA" stroke-width="2"/><text x="565.0" y="527" text-anchor="middle" font-size="23" font-weight="bold">Diagnose + reconcile</text><text x="565.0" y="556" text-anchor="middle" font-size="20" fill="#CBD5E1">Repair and revalidate eligibility</text>
<path d="M 565 577 V 645 H 10 V 121 H 215" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="70" y="630" font-size="19" fill="#CBD5E1">Bounded approved replay; same business identity</text>
<text x="35" y="697" font-size="19" fill="#CBD5E1">Publisher rejection is a separate path, not shown.</text>
</g></svg>
