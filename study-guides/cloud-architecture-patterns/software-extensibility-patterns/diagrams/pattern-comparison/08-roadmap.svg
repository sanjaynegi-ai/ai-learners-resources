<text x="61" y="310" font-family="Arial,sans-serif" font-size="14" fill="#d4dce9">Define invariants</text>
<rect x="285" y="230" width="210" height="110" rx="14" fill="#17243b" stroke="#a78bfa" stroke-width="2"/>
<text x="301" y="262" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#a78bfa">2. Isolate</text>
<text x="301" y="288" font-family="Arial,sans-serif" font-size="14" fill="#d4dce9">Ports / ACL</text>
<text x="301" y="310" font-family="Arial,sans-serif" font-size="14" fill="#d4dce9">Contract tests</text>
