<text x="541" y="310" font-family="Arial,sans-serif" font-size="14" fill="#d4dce9">Trace client p95</text>
<rect x="765" y="230" width="180" height="110" rx="14" fill="#17243b" stroke="#fb923c" stroke-width="2"/>
<text x="781" y="262" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fb923c">4. Migrate</text>
