<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="670" fill="#0b1020"/>
<text x="45" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f8fafc">Pragmatic pattern adoption roadmap</text>
<text x="45" y="88" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">Sequence work around invariants, measurement, and safe retirement.</text>
