<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
<rect width="1120" height="620" fill="#0B1020"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/></marker></defs>
<text x="52" y="58" fill="#f8fafc" font-size="29" font-family="Arial,sans-serif" font-weight="bold">Plugin isolation spectrum</text>
<text x="52" y="91" fill="#94a3b8" font-size="17" font-family="Arial,sans-serif">Trust and failure impact determine deployment</text>
<path d="M335,270.0 L410,270.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="372.5" y="260.0" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial,sans-serif">more isolation</text>
<path d="M710,270.0 L785,270.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="747.5" y="260.0" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial,sans-serif">more isolation</text>
<rect x="35" y="190" width="300" height="160" rx="13" fill="#172238" stroke="#38bdf8" stroke-width="2.3"/>
<text x="185.0" y="223" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">In-process Module</text>
<text x="185.0" y="250" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Lowest call overhead</text>
<text x="185.0" y="273" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Shared memory / crash</text>
<rect x="410" y="190" width="300" height="160" rx="13" fill="#172238" stroke="#a78bfa" stroke-width="2.3"/>
<text x="560.0" y="223" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Out-of-process</text>
<text x="560.0" y="250" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">IPC or local RPC</text>
<text x="560.0" y="273" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Process isolation</text>
<rect x="785" y="190" width="300" height="160" rx="13" fill="#172238" stroke="#34d399" stroke-width="2.3"/>
<text x="935.0" y="223" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Remote Plugin</text>
<text x="935.0" y="250" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Network API boundary</text>
<text x="935.0" y="273" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Independent scaling</text>
<rect x="42" y="533" width="1036" height="61" rx="10" fill="#111d32" stroke="#334155"/>
<text x="62" y="560" fill="#93c5fd" font-size="15" font-family="Arial,sans-serif">More isolation can reduce blast radius but adds latency, deployment and operational work.</text>
</svg>