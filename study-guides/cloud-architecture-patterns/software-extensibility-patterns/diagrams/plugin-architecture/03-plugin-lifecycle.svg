<rect x="42" y="533" width="1036" height="61" rx="10" fill="#111d32" stroke="#334155"/>
<text x="62" y="560" fill="#93c5fd" font-size="15" font-family="Arial,sans-serif">A rollback plan is part of activation, not an afterthought.</text>
