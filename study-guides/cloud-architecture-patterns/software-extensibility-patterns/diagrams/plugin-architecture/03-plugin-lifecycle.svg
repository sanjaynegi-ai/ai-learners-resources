<text x="147.5" y="240" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Manifest + binary</text>
<text x="147.5" y="263" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Provenance</text>
<rect x="315" y="180" width="205" height="130" rx="13" fill="#172238" stroke="#a78bfa" stroke-width="2.3"/>
<text x="417.5" y="213" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Validate</text>
<text x="417.5" y="240" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Signature / policy</text>
<text x="417.5" y="263" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Compatibility</text>
