<text x="52" y="58" fill="#f8fafc" font-size="29" font-family="Arial,sans-serif" font-weight="bold">Plugin lifecycle: safe activation</text>
<text x="52" y="91" fill="#94a3b8" font-size="17" font-family="Arial,sans-serif">A plugin is governed from build to retirement</text>
