<text x="552.5" y="235.0" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial,sans-serif">approve</text>
<path d="M790,245.0 L855,245.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="822.5" y="235.0" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial,sans-serif">deprecate</text>
