<text x="687.5" y="213" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Activate</text>
<text x="687.5" y="240" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Register capability</text>
<text x="687.5" y="263" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Health checks</text>
