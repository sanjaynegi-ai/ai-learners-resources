<text x="360.0" y="247.5" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial,sans-serif">verify</text>
<path d="M695,257.5 L790,257.5" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="742.5" y="247.5" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial,sans-serif">grant scope</text>
<rect x="45" y="175" width="260" height="165" rx="13" fill="#172238" stroke="#38bdf8" stroke-width="2.3"/>
<text x="175.0" y="208" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Untrusted Package</text>
<text x="175.0" y="235" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Code + dependencies</text>
<text x="175.0" y="258" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Supply-chain risk</text>
<rect x="415" y="175" width="280" height="165" rx="13" fill="#172238" stroke="#a78bfa" stroke-width="2.3"/>
<text x="555.0" y="208" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Policy Gate</text>
<text x="555.0" y="235" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Signed artifact</text>
<text x="555.0" y="258" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Allowlisted capabilities</text>
<rect x="790" y="175" width="275" height="165" rx="13" fill="#172238" stroke="#34d399" stroke-width="2.3"/>
<text x="927.5" y="208" text-anchor="middle" fill="#f8fafc" font-size="19" font-family="Arial,sans-serif" font-weight="bold">Restricted Runtime</text>
<text x="927.5" y="235" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Least privilege</text>
<text x="927.5" y="258" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="Arial,sans-serif">Egress and secrets</text>
<rect x="42" y="533" width="1036" height="61" rx="10" fill="#111d32" stroke="#334155"/>
<text x="62" y="560" fill="#93c5fd" font-size="15" font-family="Arial,sans-serif">Never assume a plugin is safe simply because it implements a valid interface.</text>
