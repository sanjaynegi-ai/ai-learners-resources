<text x="555.0" y="266.0" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="Arial">compare</text>
<path d="M800 275.0 L850 275.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)" fill="none" opacity=".9"/>
<text x="825.0" y="266.0" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="Arial">cutover</text>
<rect x="40" y="210" width="220" height="130" rx="13" fill="#151f36" stroke="#fb923c" stroke-width="2"/>
<text x="150.0" y="244" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial">Stage 1</text>
<text x="150.0" y="269" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">Monolith reads/writes</text>
<text x="150.0" y="289" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">Observe behavior</text>
<rect x="310" y="210" width="220" height="130" rx="13" fill="#151f36" stroke="#a78bfa" stroke-width="2"/>
<text x="420.0" y="244" fill="#f8fafc" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial">Stage 2</text>
<text x="420.0" y="269" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">Monolith writes</text>
<text x="420.0" y="289" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">Shadow new reads</text>
<rect x="580" y="210" width="220" height="130" rx="13" fill="#151f36" stroke="#38bdf8" stroke-width="2"/>
