<text x="960.0" y="269" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">Transfer writer</text>
<text x="960.0" y="289" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">Reconcile and retire</text>
<text x="45" y="580" fill="#94a3b8" font-size="14" font-family="Arial">Write rollback requires explicit data compatibility and reconciliation.</text></svg>