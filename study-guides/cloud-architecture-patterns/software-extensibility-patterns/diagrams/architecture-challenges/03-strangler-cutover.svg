<text x="690.0" y="289" fill="#cbd5e1" text-anchor="middle" font-size="13" font-family="Arial">One writer remains</text>
<rect x="850" y="210" width="220" height="130" rx="13" fill="#151f36" stroke="#34d399" stroke-width="2"/>
