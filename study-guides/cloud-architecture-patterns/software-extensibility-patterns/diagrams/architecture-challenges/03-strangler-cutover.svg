<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#38bdf8" stroke-width="1.6"/></marker></defs>
<rect width="1100" height="610" fill="#0b1020"/>
<text x="45" y="55" fill="#f1f5f9" font-family="Arial,sans-serif" font-weight="bold" font-size="29">Catalog migration with single-writer ownership</text>
<text x="45" y="86" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Progressive reads; explicit write authority transfer</text>
<path d="M260 275.0 L310 275.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)" fill="none" opacity=".9"/>
<text x="285.0" y="266.0" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="Arial">replicate</text>
