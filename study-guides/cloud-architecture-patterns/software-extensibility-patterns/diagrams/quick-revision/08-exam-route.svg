<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="1200" height="690" rx="24" fill="#0b1020"/><text x="50" y="65" fill="#f1f5f9" font-size="30" font-family="Arial" font-weight="700">Final self-assessment • architect the answer</text><text x="50" y="99" fill="#94a3b8" font-size="17" font-family="Arial">Use the same six-step reasoning loop in every scenario</text><rect x="55" y="145" width="340" height="130" rx="14" fill="#151f36" stroke="#38bdf8" stroke-width="2"/><text x="73" y="180" fill="#38bdf8" font-size="19" font-family="Arial" font-weight="700">1 • Define pressure</text><text x="73" y="210" fill="#dbeafe" font-size="15" font-family="Arial">Who is blocked?</text><text x="73" y="233" fill="#dbeafe" font-size="15" font-family="Arial">What must improve?</text><rect x="430" y="145" width="340" height="130" rx="14" fill="#151f36" stroke="#a78bfa" stroke-width="2"/><text x="448" y="180" fill="#a78bfa" font-size="19" font-family="Arial" font-weight="700">2 • Locate boundary</text><text x="448" y="210" fill="#dbeafe" font-size="15" font-family="Arial">Client, edge, domain,</text><text x="448" y="233" fill="#dbeafe" font-size="15" font-family="Arial">workload or deployment?</text><rect x="805" y="145" width="340" height="130" rx="14" fill="#151f36" stroke="#34d399" stroke-width="2"/><text x="823" y="180" fill="#34d399" font-size="19" font-family="Arial" font-weight="700">3 • Select pattern</text><text x="823" y="210" fill="#dbeafe" font-size="15" font-family="Arial">Choose smallest fit</text><text x="823" y="233" fill="#dbeafe" font-size="15" font-family="Arial">Name rejected alternatives</text><rect x="55" y="345" width="340" height="130" rx="14" fill="#151f36" stroke="#fb923c" stroke-width="2"/><text x="73" y="380" fill="#fb923c" font-size="19" font-family="Arial" font-weight="700">4 • Draw ownership</text><text x="73" y="410" fill="#dbeafe" font-size="15" font-family="Arial">Domain rules, data writers,</text><text x="73" y="433" fill="#dbeafe" font-size="15" font-family="Arial">contracts and trust</text><rect x="430" y="345" width="340" height="130" rx="14" fill="#151f36" stroke="#fb7185" stroke-width="2"/><text x="448" y="380" fill="#fb7185" font-size="19" font-family="Arial" font-weight="700">5 • Plan failure</text><text x="448" y="410" fill="#dbeafe" font-size="15" font-family="Arial">Timeout, rollback,</text><text x="448" y="433" fill="#dbeafe" font-size="15" font-family="Arial">idempotency, fallback</text><rect x="805" y="345" width="340" height="130" rx="14" fill="#151f36" stroke="#38bdf8" stroke-width="2"/><text x="823" y="380" fill="#38bdf8" font-size="19" font-family="Arial" font-weight="700">6 • Measure value</text><text x="823" y="410" fill="#dbeafe" font-size="15" font-family="Arial">SLO, migration gates,</text><text x="823" y="433" fill="#dbeafe" font-size="15" font-family="Arial">cost and ROI</text><text x="50" y="650" fill="#94a3b8" font-size="15" font-family="Arial">QuickCart architecture revision • schematic, not to scale</text></svg>