<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="1200" height="690" rx="24" fill="#0b1020"/><text x="50" y="65" fill="#f1f5f9" font-size="30" font-family="Arial" font-weight="700">Safety • trace the failure path</text><text x="50" y="99" fill="#94a3b8" font-size="17" font-family="Arial">A retry is not safe merely because a proxy can perform it</text><rect x="55" y="160" width="330" height="150" rx="14" fill="#151f36" stroke="#38bdf8" stroke-width="2"/><text x="73" y="195" fill="#38bdf8" font-size="19" font-family="Arial" font-weight="700">Checkout request</text><text x="73" y="225" fill="#dbeafe" font-size="15" font-family="Arial">Client idempotency key</text><text x="73" y="248" fill="#dbeafe" font-size="15" font-family="Arial">Domain validation</text><rect x="435" y="160" width="330" height="150" rx="14" fill="#151f36" stroke="#a78bfa" stroke-width="2"/><text x="453" y="195" fill="#a78bfa" font-size="19" font-family="Arial" font-weight="700">Payment provider</text><text x="453" y="225" fill="#dbeafe" font-size="15" font-family="Arial">Timeout: outcome unknown</text><text x="453" y="248" fill="#dbeafe" font-size="15" font-family="Arial">No blind replay</text><rect x="815" y="160" width="330" height="150" rx="14" fill="#151f36" stroke="#34d399" stroke-width="2"/><text x="833" y="195" fill="#34d399" font-size="19" font-family="Arial" font-weight="700">Reconciliation</text><text x="833" y="225" fill="#dbeafe" font-size="15" font-family="Arial">Query provider status</text><text x="833" y="248" fill="#dbeafe" font-size="15" font-family="Arial">Resolve exactly-once effect</text><rect x="55" y="390" width="330" height="140" rx="14" fill="#151f36" stroke="#fb923c" stroke-width="2"/><text x="73" y="425" fill="#fb923c" font-size="19" font-family="Arial" font-weight="700">Gateway / BFF</text><text x="73" y="455" fill="#dbeafe" font-size="15" font-family="Arial">Bounded timeout budget</text><text x="73" y="478" fill="#dbeafe" font-size="15" font-family="Arial">No business authority</text><rect x="435" y="390" width="330" height="140" rx="14" fill="#151f36" stroke="#fb7185" stroke-width="2"/><text x="453" y="425" fill="#fb7185" font-size="19" font-family="Arial" font-weight="700">Flag rollback</text><text x="453" y="455" fill="#dbeafe" font-size="15" font-family="Arial">Disable new UI path</text><text x="453" y="478" fill="#dbeafe" font-size="15" font-family="Arial">Cannot undo committed payment</text><rect x="815" y="390" width="330" height="140" rx="14" fill="#151f36" stroke="#38bdf8" stroke-width="2"/><text x="833" y="425" fill="#38bdf8" font-size="19" font-family="Arial" font-weight="700">Observability</text><text x="833" y="455" fill="#dbeafe" font-size="15" font-family="Arial">Trace ID + order ID</text><text x="833" y="478" fill="#dbeafe" font-size="15" font-family="Arial">SLO and error budgets</text><text x="50" y="650" fill="#94a3b8" font-size="15" font-family="Arial">QuickCart architecture revision • schematic, not to scale</text></svg>