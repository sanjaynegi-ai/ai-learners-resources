<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Kubernetes Pod: what is shared and what is not"><rect width="1200" height="440" fill="#0B1020"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#e2e8f0" stroke-width="1.5"/></marker></defs><text x="30" y="43" fill="#f8fafc" font-size="26" font-weight="bold" font-family="Arial">Kubernetes Pod: what is shared and what is not</text>
<path d="M320 195 L445 195" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="382.5" y="186.0" fill="#fbbf24" font-family="Arial" font-size="14" text-anchor="middle">localhost</text>
<path d="M725 195 L855 195" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="790.0" y="186.0" fill="#fbbf24" font-family="Arial" font-size="14" text-anchor="middle">same Pod</text>
<rect x="40" y="135" width="280" height="120" rx="12" fill="#17243B" stroke="#22d3ee" stroke-width="2.5"/>
<text x="180.0" y="186.0" font-family="Arial" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">App container</text>
<text x="180.0" y="213.0" font-family="Arial" fill="#cbd5e1" font-size="14" text-anchor="middle">Own filesystem and memory</text>
<rect x="445" y="135" width="280" height="120" rx="12" fill="#17243B" stroke="#a78bfa" stroke-width="2.5"/>
<text x="585.0" y="186.0" font-family="Arial" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Sidecar container</text>
<text x="585.0" y="213.0" font-family="Arial" fill="#cbd5e1" font-size="14" text-anchor="middle">Own filesystem and memory</text>
<rect x="855" y="135" width="280" height="120" rx="12" fill="#17243B" stroke="#34d399" stroke-width="2.5"/>
<text x="995.0" y="186.0" font-family="Arial" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Shared Pod network</text>
<text x="995.0" y="213.0" font-family="Arial" fill="#cbd5e1" font-size="14" text-anchor="middle">Same IP and port space</text>
<text x="30" y="407" fill="#fbbf24" font-family="Arial" font-size="15">Shared files require configured volumes; CPU and memory are consumed, not automatically shared as one heap.</text></svg>