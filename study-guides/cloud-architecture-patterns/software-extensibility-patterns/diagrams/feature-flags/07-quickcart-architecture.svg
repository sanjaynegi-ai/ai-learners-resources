<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="QuickCart feature-flag architecture">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#7dd3fc" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="540" fill="#0B1020"/>
<text x="45" y="58" font-size="29" font-family="Arial,sans-serif" font-weight="bold" fill="#f8fafc">QuickCart feature-flag architecture</text>
<text x="45" y="86" font-size="16" font-family="Arial,sans-serif" fill="#a5b4fc">BFF and domain services evaluate only the decisions they own</text>
<path d="M250.0 190.0 L285.0 190.0" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M495.0 190.0 L530.0 190.0" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M740.0 190.0 L775.0 190.0" stroke="#7dd3fc" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect x="50" y="150" width="190" height="80" rx="12" fill="#151e35" stroke="#22d3ee" stroke-width="2"/>
<text x="145" y="181" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="bold" fill="#f8fafc">Web / Mobile</text>
<text x="145" y="205" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#cbd5e1">customer UI</text>
<rect x="295" y="150" width="190" height="80" rx="12" fill="#151e35" stroke="#a78bfa" stroke-width="2"/>
<text x="390" y="181" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="bold" fill="#f8fafc">BFF</text>
<text x="390" y="205" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#cbd5e1">presentation</text>
<rect x="540" y="150" width="190" height="80" rx="12" fill="#151e35" stroke="#34d399" stroke-width="2"/>
<text x="635" y="181" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="bold" fill="#f8fafc">Checkout API</text>
<text x="635" y="205" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#cbd5e1">business policy</text>
<rect x="785" y="150" width="190" height="80" rx="12" fill="#151e35" stroke="#fb923c" stroke-width="2"/>
<text x="880" y="181" text-anchor="middle" font-size="17" font-family="Arial,sans-serif" font-weight="bold" fill="#f8fafc">Payment</text>
<text x="880" y="205" text-anchor="middle" font-size="13" font-family="Arial,sans-serif" fill="#cbd5e1">idempotent</text>
<rect x="45" y="435" width="910" height="70" rx="10" fill="#111b30" stroke="#334155"/>
<text x="65" y="463" font-size="15" font-family="Arial,sans-serif" fill="#e2e8f0">UI exposure and payment behavior are separate decisions with separate owners.</text>
<text x="65" y="488" font-size="15" font-family="Arial,sans-serif" fill="#e2e8f0">A flag does not bypass checkout validation, authorization or idempotency.</text>
</svg>