<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="BFF fan-out and partial failure">
<rect width="1000" height="550" fill="#0B1020"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="bold">BFF fan-out and partial failure</text>
<text x="40" y="78" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Protect client latency with bounded dependency budgets</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#94a3b8"/></marker></defs>
<line x1="235" y1="265" x2="320" y2="265" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="525" y1="245" x2="650" y2="165" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="525" y1="270" x2="650" y2="300" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="525" y1="290" x2="650" y2="435" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40" y="210" width="195" height="115" rx="12" fill="#141f36" stroke="#22d3ee" stroke-width="2"/>
<text x="137.5" y="240" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Client</text>
<text x="137.5" y="263" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">500 ms target</text>
<rect x="320" y="210" width="205" height="115" rx="12" fill="#141f36" stroke="#a78bfa" stroke-width="2"/>
<text x="422.5" y="240" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Mobile BFF</text>
<text x="422.5" y="263" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Deadline: 420 ms</text>
<text x="422.5" y="283" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Partial response</text>
<rect x="650" y="120" width="280" height="90" rx="12" fill="#141f36" stroke="#34d399" stroke-width="2"/>
<text x="790.0" y="150" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Catalog</text>
<text x="790.0" y="173" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Required: 180 ms</text>
<rect x="650" y="255" width="280" height="90" rx="12" fill="#141f36" stroke="#fb923c" stroke-width="2"/>
<text x="790.0" y="285" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Reviews</text>
<text x="790.0" y="308" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Optional: 250 ms</text>
<rect x="650" y="390" width="280" height="90" rx="12" fill="#141f36" stroke="#fb7185" stroke-width="2"/>
<text x="790.0" y="420" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Offers</text>
<text x="790.0" y="443" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Optional: timeout</text>
<text x="40" y="516" fill="#a5b4fc" font-family="Arial" font-size="15">Illustrative: return product data even if optional recommendations time out.</text>
</svg>