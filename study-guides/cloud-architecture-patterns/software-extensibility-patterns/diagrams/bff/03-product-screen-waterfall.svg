<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="Network waterfall vs aggregation">
<rect width="1000" height="550" fill="#0B1020"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Network waterfall vs aggregation</text>
<text x="40" y="78" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Illustrative latency budgets; not universal performance claims</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#94a3b8"/></marker></defs>
<line x1="245" y1="200" x2="380" y2="200" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="312.5" y="191.0" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">4 round trips</text>
<line x1="605" y1="200" x2="735" y2="200" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="245" y1="395" x2="380" y2="395" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="312.5" y="386.0" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">1 round trip</text>
<line x1="605" y1="395" x2="735" y2="395" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="670.0" y="386.0" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">fan-out</text>
<rect x="40" y="150" width="205" height="100" rx="12" fill="#141f36" stroke="#22d3ee" stroke-width="2"/>
<text x="142.5" y="180" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Mobile Client</text>
<text x="142.5" y="203" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">4 API calls</text>
<rect x="380" y="150" width="225" height="115" rx="12" fill="#141f36" stroke="#fb7185" stroke-width="2"/>
<text x="492.5" y="180" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Direct Calls</text>
<text x="492.5" y="203" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Catalog → Reviews</text>
<text x="492.5" y="223" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Inventory → Offers</text>
<rect x="735" y="150" width="215" height="100" rx="12" fill="#141f36" stroke="#34d399" stroke-width="2"/>
<text x="842.5" y="180" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Domain APIs</text>
<text x="842.5" y="203" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Multiple endpoints</text>
<rect x="40" y="345" width="205" height="100" rx="12" fill="#141f36" stroke="#22d3ee" stroke-width="2"/>
<text x="142.5" y="375" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Mobile Client</text>
<text x="142.5" y="398" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">1 screen request</text>
<rect x="380" y="345" width="225" height="100" rx="12" fill="#141f36" stroke="#a78bfa" stroke-width="2"/>
<text x="492.5" y="375" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Mobile BFF</text>
<text x="492.5" y="398" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Parallel fan-out</text>
<rect x="735" y="345" width="215" height="100" rx="12" fill="#141f36" stroke="#34d399" stroke-width="2"/>
<text x="842.5" y="375" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Domain APIs</text>
<text x="842.5" y="398" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Same sources</text>
<text x="40" y="516" fill="#a5b4fc" font-family="Arial" font-size="15">Aggregation reduces client round trips but can add server work and failure coupling.</text>
</svg>