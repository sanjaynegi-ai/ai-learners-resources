<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="Responsibility ownership">
<rect width="1000" height="550" fill="#0B1020"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Responsibility ownership</text>
<text x="40" y="78" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Put experience decisions at the edge; preserve domain invariants</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#94a3b8"/></marker></defs>
<line x1="305" y1="260" x2="370" y2="260" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="630" y1="260" x2="695" y2="260" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="45" y="150" width="260" height="230" rx="12" fill="#141f36" stroke="#22d3ee" stroke-width="2"/>
<text x="175.0" y="180" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Client</text>
<text x="175.0" y="203" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Screen layout</text>
<text x="175.0" y="223" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Navigation</text>
<text x="175.0" y="243" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Local UI state</text>
<rect x="370" y="150" width="260" height="230" rx="12" fill="#141f36" stroke="#a78bfa" stroke-width="2"/>
<text x="500.0" y="180" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">BFF</text>
<text x="500.0" y="203" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Response shaping</text>
<text x="500.0" y="223" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">API composition</text>
<text x="500.0" y="243" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Client error mapping</text>
<rect x="695" y="150" width="260" height="230" rx="12" fill="#141f36" stroke="#34d399" stroke-width="2"/>
<text x="825.0" y="180" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Domain Services</text>
