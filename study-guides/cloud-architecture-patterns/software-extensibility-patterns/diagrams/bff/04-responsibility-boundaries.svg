<text x="825.0" y="243" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Payment authorization</text>
<text x="40" y="516" fill="#a5b4fc" font-family="Arial" font-size="15">Never copy authoritative pricing or checkout validation into BFFs.</text>
