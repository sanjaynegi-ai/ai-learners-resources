<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="Deployment and observability">
<rect width="1000" height="550" fill="#0B1020"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Deployment and observability</text>
<text x="40" y="78" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Client-specific rollout, shared telemetry and rollback</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#94a3b8"/></marker></defs>
<line x1="225" y1="195" x2="360" y2="255" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="225" y1="390" x2="360" y2="325" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="590" y1="290" x2="725" y2="290" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="35" y="145" width="190" height="100" rx="12" fill="#141f36" stroke="#a78bfa" stroke-width="2"/>
<text x="130.0" y="175" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Web BFF v2</text>
<text x="130.0" y="198" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Canary 10%</text>
<rect x="35" y="340" width="190" height="100" rx="12" fill="#141f36" stroke="#22d3ee" stroke-width="2"/>
<text x="130.0" y="370" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Mobile BFF v1</text>
<text x="130.0" y="393" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Stable</text>
<rect x="360" y="215" width="230" height="150" rx="12" fill="#141f36" stroke="#fb923c" stroke-width="2"/>
<text x="475.0" y="245" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Telemetry</text>
<text x="475.0" y="268" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">p95 / errors / traces</text>
<text x="475.0" y="288" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Payload / dependency calls</text>
<text x="475.0" y="308" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Release / client version</text>
<rect x="725" y="215" width="225" height="150" rx="12" fill="#141f36" stroke="#34d399" stroke-width="2"/>
<text x="837.5" y="245" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Shared APIs</text>
<text x="837.5" y="268" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Contracts / SLOs</text>
<text x="837.5" y="288" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Version compatibility</text>
<text x="40" y="516" fill="#a5b4fc" font-family="Arial" font-size="15">Track experience-level outcomes, not just CPU and HTTP 200 rates.</text>
</svg>