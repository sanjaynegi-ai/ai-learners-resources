<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-label="Gateway, BFF, GraphQL">
<rect width="1000" height="550" fill="#0B1020"/>
<text x="40" y="48" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Gateway, BFF, GraphQL</text>
<text x="40" y="78" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Different roles that may coexist</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#94a3b8"/></marker></defs>
<line x1="220" y1="275" x2="290" y2="275" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="475" y1="275" x2="550" y2="275" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="735" y1="275" x2="810" y2="275" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="35" y="220" width="185" height="115" rx="12" fill="#141f36" stroke="#22d3ee" stroke-width="2"/>
<text x="127.5" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Clients</text>
<text x="127.5" y="273" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Web / Mobile</text>
<rect x="290" y="220" width="185" height="115" rx="12" fill="#141f36" stroke="#fb923c" stroke-width="2"/>
<text x="382.5" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">API Gateway</text>
<text x="382.5" y="273" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Auth policy</text>
<text x="382.5" y="293" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Routing / limits</text>
<rect x="550" y="220" width="185" height="115" rx="12" fill="#141f36" stroke="#a78bfa" stroke-width="2"/>
<text x="642.5" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">BFF</text>
<text x="642.5" y="273" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Composition</text>
<text x="642.5" y="293" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Client semantics</text>
<rect x="810" y="220" width="155" height="115" rx="12" fill="#141f36" stroke="#34d399" stroke-width="2"/>
<text x="887.5" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="bold">Services</text>
<text x="887.5" y="273" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="13">Domain rules</text>
<text x="40" y="516" fill="#a5b4fc" font-family="Arial" font-size="15">GraphQL may be the interface exposed by a BFF; it is not the BFF pattern.</text>
</svg>