<text x="815" y="227" font-family="Arial,sans-serif" font-size="13" fill="#d5deeb">Rebuildable projection</text>
<rect x="430" y="405" width="400" height="105" rx="13" fill="#17243b" stroke="#34d399" stroke-width="2"/>
