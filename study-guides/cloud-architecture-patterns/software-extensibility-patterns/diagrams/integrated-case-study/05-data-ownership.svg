<rect x="35" y="601" width="1130" height="40" rx="9" fill="#111a2d"/>
<text x="52" y="626" font-family="Arial,sans-serif" font-size="14" fill="#cbd5e1">No dual-write guarantee is implied; payments require reconciliation and idempotency.</text>
