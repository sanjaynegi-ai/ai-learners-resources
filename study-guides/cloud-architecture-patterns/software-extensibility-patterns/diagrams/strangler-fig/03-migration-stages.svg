<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#94a3b8"/></marker></defs>
<rect width="1100" height="640" fill="#0B1020"/>
<text x="45" y="62" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="bold">03  Migration stages</text>
<text x="45" y="93" fill="#94a3b8" font-size="17" font-family="Arial">Incremental replacement rather than a single risky rewrite</text>
<path d="M270 262.5 L305 262.5" stroke="#94a3b8" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<path d="M535 262.5 L570 262.5" stroke="#94a3b8" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<path d="M800 262.5 L835 262.5" stroke="#94a3b8" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="210" width="230" height="105" rx="13" fill="#15223b" stroke="#38bdf8" stroke-width="2.5"/>
<text x="155.0" y="242" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold" font-family="Arial">1  Observe</text>
<text x="155.0" y="267" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">Inventory dependencies</text>
<rect x="305" y="210" width="230" height="105" rx="13" fill="#15223b" stroke="#a78bfa" stroke-width="2.5"/>
<text x="420.0" y="242" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold" font-family="Arial">2  Extract</text>
<text x="420.0" y="267" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">One bounded capability</text>
<rect x="570" y="210" width="230" height="105" rx="13" fill="#15223b" stroke="#34d399" stroke-width="2.5"/>
<text x="685.0" y="242" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold" font-family="Arial">3  Cut over</text>
<text x="685.0" y="267" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">Canary then ramp</text>
<rect x="835" y="210" width="230" height="105" rx="13" fill="#15223b" stroke="#fb923c" stroke-width="2.5"/>
<text x="950.0" y="242" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="bold" font-family="Arial">4  Retire</text>
<text x="950.0" y="267" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">Remove legacy path</text>
<rect x="45" y="548" width="1010" height="63" rx="10" fill="#17213a" stroke="#334155"/>
<text x="62" y="573" fill="#cbd5e1" font-size="16" font-family="Arial">Each stage has an explicit acceptance gate, owner, rollback plan and measurement.</text>
</svg>