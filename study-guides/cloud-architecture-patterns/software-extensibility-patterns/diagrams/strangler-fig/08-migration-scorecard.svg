<text x="45" y="62" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="bold">08  Migration scorecard</text>
<text x="45" y="93" fill="#94a3b8" font-size="17" font-family="Arial">A successful extraction needs business, technical and operational evidence</text>
