<rect x="320" y="125" width="250" height="110" rx="13" fill="#17243b" stroke="#a78bfa" stroke-width="2.5"/>
<text x="445.0" y="172.0" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="17" fill="#fff">Ambassador</text>
