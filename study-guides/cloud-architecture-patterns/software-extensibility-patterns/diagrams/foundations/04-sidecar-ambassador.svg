<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Sidecar and Ambassador: colocated, distinct roles">
<rect width="1200" height="460" fill="#0b1220"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<text x="34" y="45" fill="#fff" font-size="26" font-weight="bold" font-family="Arial">Sidecar and Ambassador: colocated, distinct roles</text>
<path d="M285 180 L350 180" fill="none" stroke="#cbd5e1" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="317" y="170" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="Arial">local</text>
<path d="M285 230 L665 230" fill="none" stroke="#cbd5e1" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="475" y="220" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="Arial">outbound</text>
<path d="M910 180 L975 180" fill="none" stroke="#cbd5e1" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="942" y="170" text-anchor="middle" fill="#fbbf24" font-size="13" font-family="Arial">network</text>
<rect x="30" y="120" width="255" height="125" rx="13" fill="#17243b" stroke="#22d3ee" stroke-width="2.5"/>
<text x="157.5" y="174.5" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="17" fill="#fff">Orders API</text>
<text x="157.5" y="200.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#cbd5e1">Core business logic</text>
<rect x="350" y="120" width="245" height="125" rx="13" fill="#17243b" stroke="#a78bfa" stroke-width="2.5"/>
<text x="472.5" y="174.5" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="17" fill="#fff">Telemetry sidecar</text>
<text x="472.5" y="200.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#cbd5e1">Logs and metrics</text>
<rect x="665" y="120" width="245" height="125" rx="13" fill="#17243b" stroke="#34d399" stroke-width="2.5"/>
<text x="787.5" y="174.5" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="17" fill="#fff">Ambassador proxy</text>
<text x="787.5" y="200.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#cbd5e1">Outbound TLS and routing</text>
<rect x="975" y="120" width="190" height="125" rx="13" fill="#17243b" stroke="#fbbf24" stroke-width="2.5"/>
<text x="1070.0" y="174.5" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="17" fill="#fff">Provider API</text>
<text x="1070.0" y="200.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#cbd5e1">External dependency</text>
<text x="34" y="419" fill="#fbbf24" font-family="Arial" font-size="15">Colocation does not imply automatic shared files, memory, or business-level retry safety.</text>
