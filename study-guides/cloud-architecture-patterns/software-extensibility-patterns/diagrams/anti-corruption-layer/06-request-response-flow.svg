<text x="910.0" y="317" font-family="Arial" font-size="15" fill="#cbd5e1" text-anchor="middle">E104 or old records</text>
<rect x="45" y="527" width="1010" height="49" rx="12" fill="#1b2b43"/>
<text x="550" y="557" font-family="Arial" font-size="17" fill="#e2e8f0" text-anchor="middle">Return path: legacy record → ACL translation → modern domain result.</text>
