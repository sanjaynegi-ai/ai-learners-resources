<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Three failure domains and the controls they need">
<rect width="1200" height="440" fill="#0b1220"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<text x="35" y="49" fill="#fff" font-family="Arial" font-weight="bold" font-size="27">Three failure domains and the controls they need</text>
<rect x="30" y="130" width="255" height="125" rx="13" fill="#18263b" stroke="#22d3ee" stroke-width="2.6"/>
<text x="157.5" y="182.5" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial" fill="#fff">Proxy failure</text>
<text x="157.5" y="210.5" text-anchor="middle" font-size="13" font-family="Arial" fill="#cbd5e1">Health / fallback</text>
<rect x="345" y="130" width="255" height="125" rx="13" fill="#18263b" stroke="#a78bfa" stroke-width="2.6"/>
<text x="472.5" y="182.5" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial" fill="#fff">Provider timeout</text>
<text x="472.5" y="210.5" text-anchor="middle" font-size="13" font-family="Arial" fill="#cbd5e1">Deadline / reconcile</text>
<rect x="660" y="130" width="255" height="125" rx="13" fill="#18263b" stroke="#34d399" stroke-width="2.6"/>
<text x="787.5" y="182.5" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial" fill="#fff">Retry storm</text>
<text x="787.5" y="210.5" text-anchor="middle" font-size="13" font-family="Arial" fill="#cbd5e1">Backoff / budget</text>
<text x="35" y="403" fill="#fbbf24" font-family="Arial" font-size="16">Do not retry a non-idempotent payment simply because the network timed out.</text>
</svg>