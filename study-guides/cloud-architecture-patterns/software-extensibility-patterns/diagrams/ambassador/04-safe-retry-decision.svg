<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Retry policy depends on operation semantics">
<rect width="1200" height="440" fill="#0b1220"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></marker></defs>
<text x="35" y="49" fill="#fff" font-family="Arial" font-weight="bold" font-size="27">Retry policy depends on operation semantics</text>
<rect x="30" y="135" width="260" height="130" rx="13" fill="#18263b" stroke="#22d3ee" stroke-width="2.6"/>
<text x="160.0" y="190.0" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial" fill="#fff">Read-only GET</text>
<text x="160.0" y="218.0" text-anchor="middle" font-size="13" font-family="Arial" fill="#cbd5e1">Bounded retry possible</text>
<rect x="350" y="135" width="260" height="130" rx="13" fill="#18263b" stroke="#a78bfa" stroke-width="2.6"/>
<text x="480.0" y="190.0" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial" fill="#fff">Payment POST</text>
<text x="480.0" y="218.0" text-anchor="middle" font-size="13" font-family="Arial" fill="#cbd5e1">Idempotency required</text>
<rect x="670" y="135" width="260" height="130" rx="13" fill="#18263b" stroke="#34d399" stroke-width="2.6"/>
<text x="800.0" y="190.0" text-anchor="middle" font-size="18" font-weight="bold" font-family="Arial" fill="#fff">Unknown outcome</text>
<text x="800.0" y="218.0" text-anchor="middle" font-size="13" font-family="Arial" fill="#cbd5e1">Query / reconcile</text>
<text x="35" y="403" fill="#fbbf24" font-family="Arial" font-size="16">Transport retry is not a substitute for business-level idempotency.</text>
</svg>