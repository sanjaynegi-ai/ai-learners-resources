<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Testing strategy">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#73d7f7"/></marker></defs>
<rect width="1100" height="600" fill="#0B1020"/>
<text x="48" y="61" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Testing strategy</text>
<text x="48" y="91" fill="#9eb4d1" font-family="Arial,sans-serif" font-size="16">Fast core tests plus real adapter and failure verification.</text>
<rect x="65" y="155" width="290" height="90" rx="13" fill="#14243b" stroke="#35d0f2" stroke-width="2"/>
<text x="210.0" y="186" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Core Unit Tests</text>
<text x="210.0" y="211" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Fakes; no external services</text>
<rect x="405" y="155" width="290" height="90" rx="13" fill="#14243b" stroke="#a78bfa" stroke-width="2"/>
<text x="550.0" y="186" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Port Contract Tests</text>
<text x="550.0" y="211" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Every adapter obeys contract</text>
<rect x="745" y="155" width="290" height="90" rx="13" fill="#14243b" stroke="#34d399" stroke-width="2"/>
<text x="890.0" y="186" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Integration Tests</text>
<text x="890.0" y="211" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Real DB / provider sandbox</text>
<rect x="245" y="350" width="290" height="90" rx="13" fill="#14243b" stroke="#fb923c" stroke-width="2"/>
<text x="390.0" y="381" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">End-to-End Tests</text>
<text x="390.0" y="406" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Full request flow</text>
<rect x="600" y="350" width="290" height="90" rx="13" fill="#14243b" stroke="#f472b6" stroke-width="2"/>
<text x="745.0" y="381" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Failure Tests</text>
<text x="745.0" y="406" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Timeout / duplicate / crash</text>
<line x1="355.0" y1="200.0" x2="405.0" y2="200.0" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="695.0" y1="200.0" x2="745.0" y2="200.0" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="550.0" y1="245.0" x2="390.0" y2="350.0" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="890.0" y1="245.0" x2="745.0" y2="350.0" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="48" y="564" fill="#b9c9df" font-family="Arial" font-size="16">A fake repository does not prove the SQL adapter works.</text>
</svg>