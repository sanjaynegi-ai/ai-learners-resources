<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Payment outcomes and reconciliation">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#73d7f7"/></marker></defs>
<rect width="1100" height="600" fill="#0B1020"/>
<text x="48" y="61" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Payment outcomes and reconciliation</text>
<text x="48" y="91" fill="#9eb4d1" font-family="Arial,sans-serif" font-size="16">Unknown is a real state, not permission to charge again.</text>
<rect x="30" y="230" width="205" height="95" rx="13" fill="#14243b" stroke="#35d0f2" stroke-width="2"/>
<text x="132.5" y="261" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">PENDING</text>
<text x="132.5" y="286" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Durable order state</text>
<rect x="300" y="230" width="220" height="95" rx="13" fill="#14243b" stroke="#a78bfa" stroke-width="2"/>
<text x="410.0" y="261" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Authorize</text>
<text x="410.0" y="286" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Same idempotency key</text>
<rect x="665" y="105" width="320" height="80" rx="13" fill="#14243b" stroke="#34d399" stroke-width="2"/>
<text x="825.0" y="136" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">AUTHORIZED</text>
<text x="825.0" y="161" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Persist success</text>
<rect x="665" y="235" width="320" height="80" rx="13" fill="#14243b" stroke="#fb923c" stroke-width="2"/>
<text x="825.0" y="266" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">DECLINED</text>
<text x="825.0" y="291" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Persist failure</text>
<rect x="665" y="365" width="320" height="85" rx="13" fill="#14243b" stroke="#f472b6" stroke-width="2"/>
<text x="825.0" y="396" fill="#f8fafc" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">UNKNOWN</text>
<text x="825.0" y="421" fill="#bbd0e4" text-anchor="middle" font-family="Arial" font-size="13">Reconcile with provider</text>
<line x1="235.0" y1="277.5" x2="300.0" y2="277.5" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="520.0" y1="277.5" x2="665.0" y2="145.0" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="592.5" y="202.25" text-anchor="middle" fill="#facc15" font-size="12" font-family="Arial">success</text>
<line x1="520.0" y1="277.5" x2="665.0" y2="275.0" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="592.5" y="267.25" text-anchor="middle" fill="#facc15" font-size="12" font-family="Arial">declined</text>
<line x1="520.0" y1="277.5" x2="665.0" y2="407.5" stroke="#73d7f7" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="592.5" y="333.5" text-anchor="middle" fill="#facc15" font-size="12" font-family="Arial">timeout</text>
<text x="48" y="564" fill="#b9c9df" font-family="Arial" font-size="16">Reconciliation checks provider state before a new attempt.</text>
</svg>