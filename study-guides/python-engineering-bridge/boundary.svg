<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">Python bridge: annotations and runtime checks have different responsibilities</title>
<desc id="desc">An external dictionary flows through explicit parse and construction checks to an immutable ticket. That ticket flows to bounded async collection and local aggregation. No arrow represents authentication, an HTTP service, real payment or model inference.</desc>
<rect width="1120" height="420" fill="#0B1020"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#94A3B8" stroke-width="2"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#F8FAFC">
<text x="30" y="45" font-size="25" font-weight="bold">Validate data before using it</text>
<rect x="30" y="145" width="225" height="110" rx="12" fill="#172136" stroke="#FBBF24"/>
<text x="50" y="183" font-size="19">External dictionary</text><text x="50" y="215" font-size="15" fill="#CBD5E1">May contain bool/text/missing</text>
<rect x="310" y="145" width="245" height="110" rx="12" fill="#172136" stroke="#22D3EE"/>
<text x="330" y="183" font-size="19">Explicit runtime checks</text><text x="330" y="215" font-size="15" fill="#CBD5E1">Shape, values, allowed fields</text>
<rect x="610" y="145" width="200" height="110" rx="12" fill="#172136" stroke="#A78BFA"/>
<text x="630" y="183" font-size="19">Immutable ticket</text><text x="630" y="215" font-size="15" fill="#CBD5E1">Validated fixture invariant</text>
<rect x="865" y="145" width="225" height="110" rx="12" fill="#172136" stroke="#4ADE80"/>
<text x="885" y="183" font-size="19">Bounded local work</text><text x="885" y="215" font-size="15" fill="#CBD5E1">Async collection + summary</text>
<text x="30" y="330" font-size="17" fill="#CBD5E1">Type hints help reasoning; explicit checks enforce the declared runtime contract.</text>
<text x="30" y="365" font-size="16" fill="#CBD5E1">Local simulation only: no HTTP API, authentication, payment provider or model quality evidence.</text>
</g>
<g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M255 200 H310"/><path d="M555 200 H610"/><path d="M810 200 H865"/></g>
</svg>
