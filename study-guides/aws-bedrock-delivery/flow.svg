<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Queued draft work reserves an attempt before Bedrock inference</title>
<desc id="desc">Authorized operator submits to SQS. Lambda reserves a bounded attempt in DynamoDB before calling Bedrock, then stores a draft for review. Failed records redrive to a dead-letter queue. CloudWatch observes failures without sending notifications.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60a5fa"/></marker></defs>
<rect width="1100" height="430" rx="16" fill="#0b1220"/>
<g font-family="Segoe UI,sans-serif" fill="#e2e8f0">
<text x="30" y="43" font-size="24" font-weight="700">Reserve before inference; ambiguous work requires reconciliation</text>
<g fill="#12233f" stroke="#334d70" stroke-width="2"><rect x="30" y="105" width="210" height="100" rx="10"/><rect x="330" y="105" width="220" height="100" rx="10"/><rect x="680" y="105" width="350" height="100" rx="10"/><rect x="330" y="280" width="300" height="110" rx="10"/><rect x="30" y="280" width="210" height="110" rx="10"/></g>
<g font-size="19" font-weight="600"><text x="50" y="135">SQS jobs</text><text x="350" y="135">Lambda worker</text><text x="700" y="135">Bedrock Converse</text><text x="350" y="312">DynamoDB authority/results</text><text x="50" y="312">Dead-letter queue</text></g>
<g font-size="15" fill="#cbd5e1"><text x="50" y="166">Trusted operator submits</text><text x="50" y="188">Same job key on replay</text><text x="350" y="166">Source/schema checks</text><text x="350" y="188">Concurrency 2; 30 s</text><text x="700" y="166">One SDK attempt; 128 output tokens</text><text x="700" y="188">Draft only, never action authority</text><text x="350" y="341">Atomic counter + immutable job hash</text><text x="350" y="366">10 reservations; ambiguous → review</text><text x="50" y="341">Three receives</text><text x="50" y="366">Inspect before redrive</text></g>
<g stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"><path d="M245 155H322"/><path d="M555 155H672"/><path d="M440 210V272"/><path d="M135 210V272"/></g>
<text x="566" y="130" font-size="14" fill="#93c5fd">After reservation</text>
<text x="451" y="246" font-size="14" fill="#93c5fd">Reserve / save draft</text>
<text x="30" y="78" font-size="15" fill="#94a3b8">Arrows show data/API flow. CloudWatch observes outcomes; no notification actions are configured.</text>
<text x="690" y="300" font-size="17" fill="#fbbf24">Processing starts disabled.</text>
<text x="690" y="330" font-size="15">Local tests/lint/build ≠ live AWS verification.</text>
<text x="690" y="359" font-size="15">Budget alerts are not spending caps.</text>
</g></svg>
